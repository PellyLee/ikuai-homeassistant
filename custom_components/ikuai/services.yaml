block_terminal:
  name: 断开终端
  description: 将终端加入 MAC 黑名单，禁止其上网。需要先在集成选项中启用写操作。
  fields:
    mac:
      name: MAC 地址
      description: 终端的 MAC 地址（支持 08:9B:4B:00:10:2E / 08-9b-4b-00-10-2e / 089b4b00102e）
      required: true
      example: "08:9B:4B:00:10:2E"
      selector:
        text:
    name:
      name: 名称
      description: 规则显示名（最长 15 字符），同时写入备注便于识别
      required: false
      example: "孩子的平板"
      selector:
        text:
    expires_hours:
      name: 自动恢复（小时）
      description: 多少小时后规则自动失效；留空表示一直生效
      required: false
      selector:
        number:
          min: 0.1
          max: 8760
          step: 0.5
          unit_of_measurement: 小时
          mode: box
    config_entry_id:
      name: 配置条目
      description: 多台 iKuai 时指定目标路由器
      required: false
      selector:
        config_entry:
          integration:
            - ikuai

allow_terminal:
  name: 恢复终端上网
  description: 从 MAC 黑名单移除该终端的所有规则。需要先启用写操作。
  fields:
    mac:
      name: MAC 地址
      description: 要放行的终端 MAC 地址
      required: true
      example: "08:9B:4B:00:10:2E"
      selector:
        text:
    config_entry_id:
      name: 配置条目
      description: 多台 iKuai 时指定目标路由器
      required: false
      selector:
        config_entry:
          integration:
            - ikuai

parental_control:
  name: 家长控制
  description: 按每周时间表禁止指定终端上网（创建一条带时间模板的丢弃 ACL 规则）。需要先启用写操作。
  fields:
    target:
      name: 目标
      description: 终端的 MAC 地址或 IPv4 地址
      required: true
      example: "08:9B:4B:00:10:2E"
      selector:
        text:
    weekdays:
      name: 生效日
      description: 周一到周日的数字组合（1=周一 … 7=周日），如 12345 表示工作日
      required: true
      example: "12345"
      selector:
        text:
    start_time:
      name: 开始时间
      description: 每日禁止上网的开始时刻（24 小时制 HH:MM）
      required: true
      example: "22:00"
      selector:
        time:
    end_time:
      name: 结束时间
      description: 每日禁止上网的结束时刻（24 小时制 HH:MM）
      required: true
      example: "07:00"
      selector:
        time:
    name:
      name: 名称
      description: 规则显示名（最长 15 字符），同时写入备注便于识别
      required: false
      example: "孩子工作日禁网"
      selector:
        text:
    config_entry_id:
      name: 配置条目
      description: 多台 iKuai 时指定目标路由器
      required: false
      selector:
        config_entry:
          integration:
            - ikuai

clear_parental_control:
  name: 清除家长控制
  description: 删除由本集成创建的家长控制规则（按「HA集成家长控制」备注标记匹配）。需要先启用写操作。
  fields:
    name:
      name: 名称
      description: 只删除名称或备注包含该文字的规则；留空删除全部家长控制规则
      required: false
      selector:
        text:
    config_entry_id:
      name: 配置条目
      description: 多台 iKuai 时指定目标路由器
      required: false
      selector:
        config_entry:
          integration:
            - ikuai

query:
  name: 查询接口
  description: 只读查询路由器 API（白名单内），用于诊断或自动化取数。
  fields:
    resource:
      name: 查询项
      description: 查询键（如 connections、app_traffic_summary、dns_config）或白名单内的原始路径
      required: true
      example: "app_traffic_summary"
      selector:
        text:
    params:
      name: 查询参数
      description: 可选查询参数字典。终端详情类需带 ip+mac（clients_traffic_load / client_app_protocols / client_protocols）；应用详情类需带 appid（app_terminal_load）或 appids（app_protocols_history）；历史序列支持 datetype=hour|day 与 math=avg|max
      required: false
      example: {"ip": "192.168.1.100", "mac": "AA:BB:CC:DD:EE:FF"}
      selector:
        object:
    config_entry_id:
      name: 配置条目
      description: 多台 iKuai 时指定目标路由器
      required: false
      selector:
        config_entry:
          integration:
            - ikuai

set_config:
  name: 修改配置
  description: 以读-改-写方式修改单例配置（DNS 代理、VPN 服务端、ALG、SNMP 等 22 项）。需要先启用写操作。
  fields:
    key:
      name: 配置项
      description: 选择要修改的单例配置（22 项之一）；真正要改的字段写在下方「修改字段」里。
      required: true
      selector:
        select:
          mode: dropdown
          options:
            - value: system_basic
              label: 系统基础设置
            - value: dns_config
              label: DNS 代理配置
            - value: dhcp_access_mode
              label: DHCP 访问控制模式
            - value: dhcp6_access_mode
              label: DHCPv6 访问控制模式
            - value: pppoe_server
              label: PPPoE 服务端
            - value: pptp_server
              label: PPTP 服务端
            - value: l2tp_server
              label: L2TP 服务端
            - value: ikev2_server
              label: IKEv2/IPSec 服务端
            - value: openvpn_server
              label: OpenVPN 服务端
            - value: web_auth
              label: WEB 认证服务
            - value: alg
              label: ALG 配置
            - value: snmp
              label: SNMP 服务
            - value: samba
              label: Samba 服务
            - value: ftp
              label: FTP 服务
            - value: security_advanced
              label: 安全中心高级设置
            - value: mac_mode
              label: MAC 黑白名单模式
            - value: remote_access
              label: 远程访问
            - value: secondary_route
              label: 网络分享控制
            - value: kernel_params
              label: 内核参数
            - value: cpufreq_mode
              label: CPU 工作模式
            - value: backup_auto
              label: 自动备份策略
            - value: vrrp
              label: VRRP 热备
    fields:
      name: 修改字段
      description: 只写要改的字段，其余字段保持路由器当前值（整个配置会回填）
      required: true
      example: {"enabled": "no"}
      selector:
        object:
    confirm:
      name: 确认高风险
      description: 远程访问 / 系统基础设置 / VRRP / WEB 认证 / MAC 模式等高风险项需传 true
      required: false
      default: false
      selector:
        boolean:
    config_entry_id:
      name: 配置条目
      description: 多台 iKuai 时指定目标路由器
      required: false
      selector:
        config_entry:
          integration:
            - ikuai

speed_test:
  name: 一键测速
  description: 启动 / 停止 / 查询 WAN 口一键测速。需要先启用写操作（status 除外）。
  fields:
    action:
      name: 动作
      description: start 启动 / stop 停止 / status 查询结果
      required: true
      example: "status"
      selector:
        select:
          options:
            - label: 启动
              value: start
            - label: 停止
              value: stop
            - label: 查询
              value: status
    interface:
      name: 测速线路
      description: 线路名；留空或 all 表示全部外网线路
      required: false
      example: "wan1"
      selector:
        text:
    config_entry_id:
      name: 配置条目
      description: 多台 iKuai 时指定目标路由器
      required: false
      selector:
        config_entry:
          integration:
            - ikuai

router_health:
  name: 路由体检
  description: 启动 / 停止 / 查询路由体检（检查固件、密码、暴露面等）。需要先启用写操作（status 除外）。
  fields:
    action:
      name: 动作
      description: start 启动 / stop 停止 / status 查询结果
      required: true
      example: "status"
      selector:
        select:
          options:
            - label: 启动
              value: start
            - label: 停止
              value: stop
            - label: 查询
              value: status
    config_entry_id:
      name: 配置条目
      description: 多台 iKuai 时指定目标路由器
      required: false
      selector:
        config_entry:
          integration:
            - ikuai

ac_service:
  name: AC 服务
  description: 启动 / 停止 / 查询无线 AC 服务（企业版 AP 管理）。需要先启用写操作（status 除外）。
  fields:
    action:
      name: 动作
      description: start 启动 / stop 停止 / status 查询状态
      required: true
      example: "status"
      selector:
        select:
          options:
            - label: 启动
              value: start
            - label: 停止
              value: stop
            - label: 查询
              value: status
    config_entry_id:
      name: 配置条目
      description: 多台 iKuai 时指定目标路由器
      required: false
      selector:
        config_entry:
          integration:
            - ikuai

restart_dhcp:
  name: 重启 DHCP
  description: 重启 DHCP 服务（新租约发放短暂中断，已连设备不受影响）。需要先启用写操作。
  fields:
    config_entry_id:
      name: 配置条目
      description: 多台 iKuai 时指定目标路由器
      required: false
      selector:
        config_entry:
          integration:
            - ikuai

set_terminal_name:
  name: 终端命名
  description: 给终端设备设置备注名（按 MAC 自动新建或更新）。需要先启用写操作。
  fields:
    mac:
      name: MAC 地址
      description: 终端 MAC 地址
      required: true
      example: "08:9B:4B:00:10:2E"
      selector:
        text:
    name:
      name: 名称
      description: 显示名（最长 15 字符）
      required: true
      example: "客厅NAS"
      selector:
        text:
    comment:
      name: 备注
      description: 备注信息（最长 64 字符）
      required: false
      selector:
        text:
    config_entry_id:
      name: 配置条目
      description: 多台 iKuai 时指定目标路由器
      required: false
      selector:
        config_entry:
          integration:
            - ikuai

set_ssid:
  name: 修改 Wi-Fi
  description: 快捷修改 AP 的一个 SSID（名称/密码/隐藏/访客模式等，APSSIDQuickUpdate）。需要先启用写操作。
  fields:
    ap_id:
      name: AP 编号
      description: AP 配置 ID（可先查 ap_list 传感器的属性）
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 512
          mode: box
    radio:
      name: 射频
      description: 2g 表示 2.4G，5g 表示 5G
      required: true
      example: "2g"
      selector:
        select:
          options:
            - label: 2.4G
              value: "2g"
            - label: 5G
              value: "5g"
    ssid_index:
      name: SSID 序号
      description: 1-4
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 4
          mode: box
    ssid:
      name: Wi-Fi 名称
      description: 新的 SSID 名称
      required: true
      example: "Home-WiFi"
      selector:
        text:
    key:
      name: Wi-Fi 密码
      description: 新密码；留空保持当前密码
      required: false
      selector:
        text:
    hide:
      name: 隐藏
      description: 1 隐藏 / 0 不隐藏；留空保持当前值
      required: false
      selector:
        number:
          min: 0
          max: 1
          mode: box
    isolate:
      name: 访客模式
      description: 1 开启 / 0 关闭；留空保持当前值
      required: false
      selector:
        number:
          min: 0
          max: 1
          mode: box
    config_entry_id:
      name: 配置条目
      description: 多台 iKuai 时指定目标路由器
      required: false
      selector:
        config_entry:
          integration:
            - ikuai

api_request:
  name: 原始 API 请求
  description: 高级用法——在白名单（Tier A+B）内发起原始 API 请求；写方法需要启用写操作，高危端点永久禁止。
  fields:
    method:
      name: 方法
      description: get / put / post / delete / patch
      required: true
      example: "get"
      selector:
        select:
          options:
            - label: GET
              value: get
            - label: PUT
              value: put
            - label: POST
              value: post
            - label: DELETE
              value: delete
            - label: PATCH
              value: patch
    path:
      name: 路径
      description: 相对路径（不含 /api/v4.0/），如 monitoring/clients-traffic-load
      required: true
      example: "monitoring/clients-traffic-load"
      selector:
        text:
    params:
      name: 查询参数
      description: URL 参数字典
      required: false
      selector:
        object:
    payload:
      name: 请求体
      description: JSON 请求体（写方法时使用）
      required: false
      selector:
        object:
    config_entry_id:
      name: 配置条目
      description: 多台 iKuai 时指定目标路由器
      required: false
      selector:
        config_entry:
          integration:
            - ikuai
